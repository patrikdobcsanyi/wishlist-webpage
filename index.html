<!DOCTYPE html>
<html lang="hu">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="Családi kívánságlista">Családi kívánságlista</title>
    <link rel="stylesheet" href="styles.css">
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <header>
      <div class="language-picker">
        <label for="language" data-i18n="Nyelv">Nyelv</label>
        <select id="language" name="language">
          <option value="hu" lang="hu">Magyar</option>
          <option value="de" lang="de">Deutsch</option>
        </select>
      </div>
      <h1 data-i18n="Családi kívánságlista">Családi kívánságlista</h1>
    </header>
    <main>
      <p id="status" role="status" aria-live="polite" data-i18n="Betöltés…">Betöltés…</p>
      <noscript>A bejelentkezéshez és a kívánságok mentéséhez engedélyezd a JavaScriptet.</noscript>

      <form id="login-form" hidden>
        <h2 data-i18n="Bejelentkezés">Bejelentkezés</h2>
        <p class="form-intro" data-i18n="Lépj be, és meríts ötletet az ajándékozáshoz.">Lépj be, és meríts ötletet az ajándékozáshoz.</p>
        <p><label><span data-i18n="Felhasználónév">Felhasználónév</span> <input name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" minlength="3" maxlength="32" pattern="[A-Za-z0-9_]{3,32}" data-i18n-title="Használj 3–32 ékezet nélküli betűt, számot vagy aláhúzásjelet." title="Használj 3–32 ékezet nélküli betűt, számot vagy aláhúzásjelet." required></label></p>
        <p><label><span data-i18n="Jelszó">Jelszó</span> <input name="password" type="password" autocomplete="current-password" required></label></p>
        <button data-i18n="Bejelentkezés">Bejelentkezés</button>
      </form>

      <section id="account" hidden>
        <p id="signed-in"></p>
        <button id="logout" type="button" data-i18n="Kijelentkezés">Kijelentkezés</button>
      </section>

      <section id="family" hidden>
        <form id="wish-form">
          <h2 data-i18n="Kívánság hozzáadása vagy szerkesztése">Kívánság hozzáadása vagy szerkesztése</h2>
          <input name="wishId" type="hidden">
          <p><label><span data-i18n="Megnevezés">Megnevezés</span> <input name="title" maxlength="120" required></label></p>
          <p><label><span data-i18n="Termék linkje (nem kötelező)">Termék linkje (nem kötelező)</span> <input name="url" type="url" maxlength="2000" placeholder="https://"></label></p>
          <p><label><span data-i18n="Megjegyzés (nem kötelező)">Megjegyzés (nem kötelező)</span> <textarea name="notes" maxlength="2000"></textarea></label></p>
          <button data-i18n="Kívánság mentése">Kívánság mentése</button>
          <button type="reset" data-i18n="Mégse">Mégse</button>
        </form>
        <div class="section-heading">
          <h2 data-i18n="Kívánságlistáink">Kívánságlistáink</h2>
          <button id="refresh" type="button" data-i18n="Listák frissítése">Listák frissítése</button>
        </div>
        <div id="profiles"></div>
      </section>

      <!-- JavaScript fills these templates. Keep the data-field hooks. -->
      <template id="profile-template">
        <section>
          <h3 data-field="name"></h3>
          <p data-field="empty" data-i18n="Még nincsenek kívánságok.">Még nincsenek kívánságok.</p>
          <ul class="wishes"></ul>
        </section>
      </template>
      <template id="wish-template">
        <li>
          <h4 data-field="title"></h4>
          <p data-field="notes"></p>
          <a data-field="url" target="_blank" rel="noopener noreferrer" data-i18n="Ajándék megtekintése">Ajándék megtekintése</a>
          <p data-field="claim"></p>
          <div data-field="actions"></div>
        </li>
      </template>
    </main>
  </body>
</html>
